<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Viewer</title>
  
  <link rel="stylesheet" href="vendor/prism-tomorrow.css">
  <link rel="stylesheet" href="css/markdown.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Minimalist Header -->
    <header class="app-header">
      <div class="header-left">
        <h1 class="app-title">Markdown Viewer</h1>
        <span class="engine-tag">Showdown</span>
      </div>

      <div class="header-actions">
        <button id="btn-paste" class="btn btn-primary" title="Paste markdown from clipboard">
          Paste
        </button>
        <button id="btn-clear" class="btn" title="Clear text">
          Clear
        </button>
        <button id="btn-sample" class="btn" title="Load sample agent markdown">
          Sample
        </button>
        <button id="btn-copy-html" class="btn" title="Copy rendered HTML">
          Copy HTML
        </button>

        <div class="btn-group" title="Switch layout">
          <button class="btn-mode active" data-mode="split">Split</button>
          <button class="btn-mode" data-mode="preview">Preview</button>
          <button class="btn-mode" data-mode="editor">Editor</button>
        </div>
      </div>
    </header>

    <!-- Workspace -->
    <main class="workspace" id="workspace">
      
      <!-- Editor (Left) -->
      <section class="editor-pane" id="editor-pane">
        <div class="pane-header">
          <span class="pane-label">Markdown Input</span>
        </div>
        
        <div class="editor-wrapper">
          <textarea 
            id="markdown-input" 
            class="markdown-textarea" 
            placeholder="Paste your agent's markdown here..."
            spellcheck="false"
            autocomplete="off"
            autofocus
          ></textarea>

          <div class="drop-overlay" id="drop-overlay">
            <span class="drop-text">Drop Markdown file here</span>
          </div>
        </div>

        <div class="editor-footer">
          <div class="stats-group">
            <div>Lines: <span id="stat-lines">0</span></div>
            <div>Words: <span id="stat-words">0</span></div>
            <div>Chars: <span id="stat-chars">0</span></div>
          </div>
        </div>
      </section>

      <!-- Resizable Split Divider -->
      <div class="split-divider" id="split-divider" title="Drag to resize"></div>

      <!-- Preview (Right) -->
      <section class="preview-pane" id="preview-pane">
        <div class="preview-content">
          <div class="markdown-body" id="preview-content"></div>
        </div>
      </section>

    </main>
  </div>

  <!-- Zoom Modal for Diagrams -->
  <div class="modal-backdrop" id="zoom-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <span class="modal-title">Diagram View</span>
        <div class="modal-controls">
          <button class="btn-modal" id="btn-zoom-out">−</button>
          <span id="zoom-label" style="font-family:monospace;font-size:0.78rem;padding:0 0.3rem;">100%</span>
          <button class="btn-modal" id="btn-zoom-in">+</button>
          <button class="btn-modal" id="btn-zoom-reset">Reset</button>
          <button class="btn-modal" id="btn-download-svg">Save SVG</button>
          <button class="btn-modal-close" id="btn-close-modal">✕</button>
        </div>
      </div>
      <div class="modal-body" id="modal-viewport">
        <div class="modal-canvas" id="modal-canvas"></div>
      </div>
      <div class="modal-footer">
        <span>Click & drag to pan. Scrollwheel or +/- to zoom. Press Esc to close.</span>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <!-- Vendor Libraries -->
  <script src="vendor/showdown.min.js"></script>
  <script src="vendor/mermaid.min.js"></script>
  <script src="vendor/prism.min.js"></script>
  <script src="vendor/prism-components/prism-python.min.js"></script>
  <script src="vendor/prism-components/prism-bash.min.js"></script>
  <script src="vendor/prism-components/prism-json.min.js"></script>
  <script src="vendor/prism-components/prism-typescript.min.js"></script>
  <script src="vendor/prism-components/prism-yaml.min.js"></script>

  <!-- Application Logic -->
  <script src="js/app.js"></script>
</body>
</html>

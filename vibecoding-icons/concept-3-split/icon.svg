<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg_c3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222222" />
      <stop offset="100%" stop-color="#121212" />
    </linearGradient>
    <linearGradient id="border_c3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3c3c3c" />
      <stop offset="100%" stop-color="#242424" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg_c3)" stroke="url(#border_c3)" stroke-width="8" />

